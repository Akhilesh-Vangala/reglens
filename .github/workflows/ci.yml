name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      # offline, deterministic baseline: fails CI if retrieval or golden labels regress
      - run: reglens eval retrieval --retrievers bm25
      - run: docker build -t reglens:ci .
