name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # real servers so the Qdrant and Neo4j parity tests run instead of skipping
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5.26
        env: {NEO4J_AUTH: neo4j/ci-only-password}
        ports: ["7687:7687"]
    env:
      QDRANT_URL: http://localhost:6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests api scripts && ruff format --check src tests api scripts
      - name: wait for neo4j
        run: for i in $(seq 1 60); do nc -z localhost 7687 && break; sleep 2; done
      - run: pytest -q -rs
      # offline, deterministic baseline: fails CI if retrieval or golden labels regress
      - run: reglens eval retrieval --retrievers bm25

  kubernetes:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t reglens:local .
      - uses: helm/kind-action@v1
        with: {cluster_name: reglens}
      - run: kind load docker-image reglens:local --name reglens
      - run: kubectl apply -k deploy/k8s
      - run: deploy/k8s/smoke.sh
      - if: failure()
        run: kubectl -n reglens get all,events --sort-by=.lastTimestamp | tail -60

  e2e:
    # the real FastAPI app in a browser: user flows plus an axe WCAG 2 A/AA scan of every tab in both themes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e "..[serve]"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results
