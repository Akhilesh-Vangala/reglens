# Full stack locally: docker compose up --build   -> http://localhost:8000
# Model keys (optional) come from .env; without them the deterministic tools still work.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes: [qdrant:/qdrant/storage]
    healthcheck: {test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"], interval: 5s, retries: 20}
  neo4j:
    image: neo4j:5.26
    environment: {NEO4J_AUTH: neo4j/compose-local-only, NEO4J_server_memory_heap_max__size: 512m}
    volumes: [neo4j:/data]
    healthcheck: {test: ["CMD-SHELL", "cypher-shell -u neo4j -p compose-local-only 'RETURN 1' || exit 1"], interval: 5s, retries: 40}
  load-stores:
    build: .
    command: ["reglens", "load-stores"]
    environment: &env
      REGLENS_RETRIEVER: qdrant_bge
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: compose-local-only
    depends_on: {qdrant: {condition: service_healthy}, neo4j: {condition: service_healthy}}
  reglens:
    build: .
    ports: ["8000:8000"]
    environment: *env
    env_file: [{path: .env, required: false}]
    read_only: true
    tmpfs: [/tmp]
    depends_on: {load-stores: {condition: service_completed_successfully}}
volumes: {qdrant: {}, neo4j: {}}
