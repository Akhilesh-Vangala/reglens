[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reglens"
version = "0.1.0"
description = "Governed RAG copilot over credit-union regulations: hybrid retrieval, verbatim-citation verification, and a measured hallucination evaluation on Azure OpenAI and Azure AI Search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sai Akhilesh Vangala" }]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.3",
  "langgraph>=0.2",
  "openai>=1.40",
  "opentelemetry-sdk>=1.25",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "fastembed>=0.4",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.29"]
stores = ["qdrant-client>=1.15", "neo4j>=5.20"]
dev = ["pytest>=8", "ruff>=0.5", "uvicorn>=0.29", "qdrant-client>=1.15", "neo4j>=5.20"]

[project.scripts]
reglens = "reglens.cli:main"
reglens-serve = "reglens.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reglens.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]
