[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reglens"
version = "0.1.0"
description = "Governed RAG copilot over credit-union regulations: hybrid retrieval, verbatim-citation verification, and a measured hallucination evaluation on Azure OpenAI and Azure AI Search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sai Akhilesh Vangala" }]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "openai>=1.40",
  "azure-search-documents>=11.5",
  "opentelemetry-sdk>=1.25",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
reglens-build = "reglens.corpus.build:main"
reglens = "reglens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]
